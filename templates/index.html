<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University Receptionist Agent</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/feather-icons"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <div class="page-wrapper">
        <header class="page-header">
            <h1>University Receptionist Agent</h1>
            <p>A central hub for managing university data and answering questions.</p>
        </header>

        <main class="main-content">
            <div class="card">
                <div class="card-header">
                    <i data-feather="inbox"></i>
                    <h2>Questions Inbox</h2>
                </div>
                <div class="card-body">
                    <div id="unanswered-questions-container" class="question-list">
                        </div>
                </div>

                <div class="card-header">
                    <i data-feather="check-square"></i>
                    <h2>Recently Answered</h2>
                </div>
                <div class="card-body">
                    <div id="answered-questions-container" class="question-list">
                        </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <i data-feather="edit"></i>
                    <h2>University Data Editor</h2>
                </div>
                <div class="card-body">
                    <div class="form-section">
                        <h3>Edit Existing Section</h3>
                        <select id="data-section-select" class="form-select">
                            <option value="">-- Select a Section --</option>
                        </select>
                        <textarea id="data-editor" class="form-textarea" placeholder="Select a section to view and edit its data..."></textarea>
                        <div id="edit-validation-message" class="validation-message"></div>
                        <button id="update-data-btn" class="btn btn-success">
                            <i data-feather="check-circle"></i>
                            Update Section
                        </button>
                    </div>

                    <hr class="form-divider" />

                    <div class="form-section">
                        <h3>Add New Section</h3>
                        <input type="text" id="new-section-key" class="form-input" placeholder="New Section Name (e.g., 'admissions_info')" />
                        <textarea id="new-section-data" class="form-textarea" placeholder="Enter new section data in JSON format..."></textarea>
                        <div id="add-validation-message" class="validation-message"></div>
                        <button id="add-section-btn" class="btn btn-primary">
                            <i data-feather="plus-circle"></i>
                            Add New Section
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <script>
        feather.replace();
    </script>
</body>
</html>
